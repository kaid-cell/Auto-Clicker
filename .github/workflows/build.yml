name: Build BleeClicker.exe

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest -v tests

      - name: Build BleeClicker.exe
        run: pyinstaller --clean --noconfirm BleeClicker.spec

      - name: Smoke-test the exe starts
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\BleeClicker.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "BleeClicker.exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Get-Item dist\BleeClicker.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: BleeClicker
          path: dist/BleeClicker.exe
